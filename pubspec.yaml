name: kumo_ui
description: "Cloudflare's Kumo UI design system for Flutter, on widgets.dart alone: light and dark schemes, the dashboard component set, and pure-Dart charts. No Material or Cupertino."
version: 1.7.0
homepage: https://github.com/hafizhfadh/flutter_kumo_ui
repository: https://github.com/hafizhfadh/flutter_kumo_ui
issue_tracker: https://github.com/hafizhfadh/flutter_kumo_ui/issues
topics:
  - flutter
  - design-system
  - ui-components
  - charts
  - theming

environment:
  sdk: ^3.13.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  phosphor_icons: ^3.0.1
  # The chart projection engine is pure Dart and imports no Flutter widgets, so
  # it takes Matrix4 and Vector3 straight from the math package Flutter itself
  # depends on. Flutter only re-exports Matrix4, not Vector3.
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Exercises KumoApp.router against a real RouterConfig. Test-only: go_router
  # never reaches lib/, and it renders NoTransitionPage under a bare WidgetsApp,
  # so no Material widget enters the tree.
  go_router: ^18.0.1

